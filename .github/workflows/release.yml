name: Release

# Triggered when you publish a GitHub Release through the UI.
# The release tag (e.g. v0.0.3) defines the version that gets published.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Set version from release tag
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Releasing version $VERSION (tag $TAG)"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build & test
        run: |
          npm run build
          npm test

      # Trusted Publishing (OIDC): no NPM_TOKEN needed. Requires `id-token: write`
      # (set above) and npm >= 11.5.1, which generates provenance automatically.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --access public
